<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="{{ '/' | relative_url }}">Gahyun Baek</a>
      <div class="nav-links">
        <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active" aria-current="page"{% endif %}>About</a>
        <a href="{{ '/paper-reviews/' | relative_url }}"{% if page.url contains '/paper-reviews' %} class="active" aria-current="page"{% endif %}>Reviews</a>
        {% comment %} Projects page disabled until real projects replace the mock data in _data/projects.yml.
        <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} class="active" aria-current="page"{% endif %}>Projects</a>
        {% endcomment %}
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active" aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv' %} class="active" aria-current="page"{% endif %}>CV</a>
        <a href="{{ '/guestbook/' | relative_url }}"{% if page.url contains '/guestbook' %} class="active" aria-current="page"{% endif %}>Guestbook</a>
      </div>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© {{ site.time | date: '%Y' }} Gahyun Baek</p>
      <p><a href="mailto:gusqorrk@gmail.com">Email</a> · <a href="https://github.com/gahyunBaek" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>
  <script>
    (function () {
      var button = document.querySelector('.theme-toggle');
      var icon = button.querySelector('.theme-icon');
      function sync() {
        var dark = document.documentElement.dataset.theme === 'dark';
        icon.textContent = dark ? '☀' : '☾';
        button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      button.addEventListener('click', function () {
        var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
        var giscusFrame = document.querySelector('iframe.giscus-frame');
        if (giscusFrame) {
          giscusFrame.contentWindow.postMessage({ giscus: { setConfig: { theme: next } } }, 'https://giscus.app');
        }
      });
      sync();
    })();
  </script>
  <script>
    console.log("%cSecurity + Software", "color:#1d4ed8;font-family:monospace;font-size:14px;font-weight:700;");
    console.log("%cchecking the console already? good instincts.", "color:#6e6e6e;font-family:monospace;font-size:12px;");
    console.log("%c-> gusqorrk@gmail.com", "color:#6e6e6e;font-family:monospace;font-size:12px;");
  </script>
</body>
</html>
